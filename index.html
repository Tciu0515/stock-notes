  function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
  function parseD(s){ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; }
  function ageDays(s){ const d=parseD(s); return d? Math.round((today()-d)/864e5) : null; }

  function mkt(r){ return r.market==="TW" ? "TW" : "US"; }
  function stOf(r){ return r.status==="tw" ? "consider" : r.status; }
  function fmtAnn(a){ if(a==null||a==="") return '<span class="muted">—</span>'; const n=+a; const c=n>=15?"ann-pos":(n<0?"ann-neg":"ann-mid"); return '<span class="num '+c+'">'+(n>0?"+":"")+n+'%</span>'; }
  function fmtPx(p, cur){ if(p==null||p==="") return "—"; const n=+p; const s = n>=1000? n.toLocaleString("en-US",{maximumFractionDigits:0}) : (n>=100? n.toFixed(0) : (n>=10? n.toFixed(1): n.toFixed(2))); return s + (cur&&cur!=="USD"? " "+cur : ""); }

     "2028 年初" -> early, "約 2.2 年" -> research date + 2.2 years; otherwise the years implied by the
     15%/20% entry prices. Annual return at a price = (target / price)^(1 / years left) - 1. */
  function tgtInfo(r){
    if (r._ti !== undefined) return r._ti;
    let d = null, label = "";
    const h = String(r.horizon||"");
    const m = /(20\d\d)\s*年\s*(底|中|初)?/.exec(h);
    if (m){ const y=+m[1], k=m[2]||"底"; d = new Date(y, k==="初"?0:(k==="中"?5:11), k==="初"?31:30); label = y+" 年"+(m[2]||"底"); }
    else {
      let yrs = null; const m2 = /約\s*([\d.]+)\s*年/.exec(h);
      if (m2) yrs = +m2[1];
      else if (r.target!=null){ for (const e of (r.entries||[])){ const rr=+e.r/100, p=+e.p; if(rr>0 && p>0 && r.target>p){ const T=Math.log(r.target/p)/Math.log(1+rr); if(T>0.2 && T<15){ yrs=T; break; } } } }
      const d0 = parseD(r.date);
      if (yrs && d0){ d = new Date(d0.getTime()+yrs*365.25*864e5); const mo=d.getMonth(); label = "約 "+d.getFullYear()+" 年"+(mo<4?"初":(mo<8?"中":"底")); }
    }
    r._ti = d ? {d, label} : null;
    return r._ti;
  }
  function yearsLeft(r){ const ti=tgtInfo(r); return ti ? (ti.d - today())/(365.25*864e5) : null; }
  function priceOf(r){ const q = (typeof LIVE!=="undefined" && LIVE.px) ? LIVE.px[r.ticker] : null; return q && q.price!=null ? q : null; }
  function curAnn(r){
    const q = priceOf(r), T = yearsLeft(r);
    if (!q || r.target==null || T==null || T<0.1) return null;
    const ratio = r.target/q.price; if (ratio>20 || ratio<0.05) return null;
    return Math.round((Math.pow(ratio, 1/T)-1)*100);
  }
  function annKey(r){ const a = CFG.live ? curAnn(r) : null; return a!=null ? a : (r.annual==null ? -999 : +r.annual); }
  function fmtLive(p, cur){ const n=+p; const s = n>=1000? n.toLocaleString("en-US",{maximumFractionDigits:0}) : n.toFixed(2); return s + (cur&&cur!=="USD"? " "+cur : ""); }
  function sgnPct(n, dec){ const v=Math.abs(n).toFixed(dec==null?0:dec); return (n>0?"+":(n<0?"−":""))+v+"%"; }
  function meter(a){ if (a==null) return ""; const w = a>0 ? Math.max(3, Math.min(100, a*2.2)) : 3; return '<div class="meter"><i style="width:'+w+'%;background:'+(a>=15?"var(--good)":(a<0?"var(--bad)":"var(--warn)"))+'"></i></div>'; }
  function annCls(a){ return a>=15?"ann-pos":(a<0?"ann-neg":"ann-mid"); }
  function gapLine(r, price){
    const hit = (r.entries||[]).filter(e=>+e.p>0 && price<=+e.p && price/+e.p>0.05).sort((a,b)=>b.r-a.r)[0];
    const e15 = entry(r,15);
    if (hit) return '<div class="gapl hit">已低於 '+esc(hit.r)+'% 進場價'+(e15?'（15% 進場價 '+fmtPx(e15,r.currency)+'）':'')+'</div>';
    if (e15 && price/e15<20) return '<div class="gapl">距 15% 進場價 '+sgnPct((e15/price-1)*100,1)+'（15% 進場價 '+fmtPx(e15,r.currency)+'）</div>';
    return "";
  }
  /* the price-dependent part of a card or of the detail key row; repainted when prices arrive */
  function liveInner(r, mode){
    const q = CFG.live ? priceOf(r) : null, ti = tgtInfo(r), cur = r.currency||"USD";
    const tgtLbl = ti ? ' <small>'+esc(ti.label)+'</small>' : '';

        h += '<div><span class="lbl">目標價</span><span class="v">'+fmtPx(r.target,cur)+'</span>'+tgtLbl+'</div>';
        const a = curAnn(r), T = yearsLeft(r);
        h += '<div><span class="lbl">以現價推算年化</span><span class="v">'+(a==null?'<span class="muted">—</span>':'<span class="'+annCls(a)+'">'+sgnPct(a)+'</span>')+'</span>'+(a!=null&&T?'<small>約 '+T.toFixed(1)+' 年</small>':'')+'</div>';
      } else {
        h += '<div><span class="lbl">預期年化</span><span class="v">'+fmtAnn(r.annual)+'</span></div>';
        h += '<div><span class="lbl">加權目標</span><span class="v">'+fmtPx(r.target,cur)+'</span>'+tgtLbl+'</div>';
      }
      return h;
    }
    if (CFG.live){
      if (q){
        h += '<div class="pxrow"><span class="big">'+fmtLive(q.price,cur)+'</span>'+(q.pct!=null?'<span class="num '+(q.pct>=0?"chg-up":"chg-dn")+'">'+(q.pct>=0?"▲ ":"▼ ")+sgnPct(q.pct,2)+'</span>':'')+'</div>';
        h += gapLine(r, q.price);
      } else {
        h += '<div class="pxrow"><span class="big muted">'+((typeof LIVE!=="undefined"&&LIVE.state==="wait")?"…":"—")+'</span></div>';
      }
      const a = curAnn(r), T = yearsLeft(r);
      h += '<div class="figs"><div><span class="k">目標價</span><span class="v">'+fmtPx(r.target,cur)+'</span>'+tgtLbl+'</div>';
      h += '<div><span class="k">以現價推算年化</span>'+(a==null?'<span class="v muted">—</span>':'<span class="v '+annCls(a)+'">'+sgnPct(a)+'</span>'+(T?' <small>約 '+T.toFixed(1)+' 年</small>':''))+'</div></div>';
      h += meter(a);
    } else {
      const e15 = entry(r,15);
      h += '<div class="figs"><div><span class="k">目標價</span><span class="v">'+fmtPx(r.target,cur)+'</span>'+tgtLbl+'</div>';
      h += '<div><span class="k">預期年化</span><span class="v">'+fmtAnn(r.annual)+'</span></div></div>';
      h += meter(r.annual==null?null:+r.annual);
      if (e15) h += '<div class="gapl">15% 進場價 '+fmtPx(e15,cur)+'</div>';
    }
    return h;
  }
  /* size and risk */
  const SIZE = {mega:"巨型股", large:"大型股", mid:"中型股", small:"小型股", micro:"微型股"};
  const RISK = {low:{t:"低",c:"rk-low"}, mid:{t:"中",c:"rk-mid"}, high:{t:"高",c:"rk-high"}, vhigh:{t:"很高",c:"rk-vhigh"}};
  const RISK_ORDER = {low:0, mid:1, high:2, vhigh:3};
  const FX = {USD:1, TWD:1/32, GBP:1.3, GBp:0.013, AUD:0.65, EUR:1.08};
  function mcapOf(r){
    const q = (typeof LIVE!=="undefined" && LIVE.px) ? LIVE.px[r.ticker] : null;
    if (!q || !q.mcap) return null;
    let v = +q.mcap, c = q.mcur || r.currency || "USD";
    if (c==="GBp"){ v = v/100; c = "GBP"; }
    return {v, c, usd: v*(FX[c]||1)};
  }
  function sizeOf(r){
    const m = mcapOf(r);
    if (m){ const u=m.usd; return u>=2e11?"mega":(u>=1e10?"large":(u>=2e9?"mid":(u>=3e8?"small":"micro"))); }
    return r.size || null;
  }
  function fmtCap(m){
    const unit = {USD:"美元", TWD:"台幣", GBP:"英鎊", AUD:"澳幣", EUR:"歐元"}[m.c] || m.c;
    if (m.v>=1e12) return (m.v/1e12).toFixed(m.v>=1e13?1:2)+" 兆"+unit;
    if (m.v>=1e8) return Math.round(m.v/1e8).toLocaleString("en-US")+" 億"+unit;
    return (m.v/1e8).toFixed(1)+" 億"+unit;
  }
  function riskTag(r){ const k=r.risk&&r.risk.l; if(!RISK[k]) return ""; return '<span class="rk '+RISK[k].c+'" title="'+esc(r.risk.t||"")+'">風險 '+RISK[k].t+'</span>'; }
  function capLine(r){
    const m = mcapOf(r), sz = sizeOf(r);
    const parts = [];
    if (m) parts.push('市值 '+fmtCap(m));
    if (sz && SIZE[sz]) parts.push(SIZE[sz]);
    return parts.join(" · ");
  }
  function sizeRiskInner(r){
    const cl = capLine(r);
    return (cl? '<span class="cap">'+esc(cl)+'</span>' : '')+riskTag(r);
  }
  function paintLiveParts(){
    document.querySelectorAll("[data-sr]").forEach(el=>{ const r=rows.find(x=>x.ticker===el.dataset.sr); if(r) el.innerHTML=sizeRiskInner(r); });
    document.querySelectorAll("[data-live]").forEach(el=>{ const r=rows.find(x=>x.ticker===el.dataset.live); if(r) el.innerHTML=liveInner(r, el.dataset.mode||"card"); });
  }

  function yahooSym(r){ const c=r.currency||"USD"; if(mkt(r)==="TW") return r.ticker+".TW"; if(c==="GBp"||c==="GBP") return r.ticker+".L"; if(c==="AUD") return r.ticker+".AX"; return r.ticker; }
  /*LIVE-START*/
  /* ---------- prices from prices.json (same site; updated by a scheduled job, no key) ---------- */
  const LIVE = {px:{}, state:"wait", msg:"", at:null, busy:false};
  let dbRef = null, mcp = null;
  function pxCell(){ return ""; } function annNowCell(){ return ""; }
  function liveBar(){
    const dot = LIVE.state==="on" ? "on" : (LIVE.state==="err" ? "err" : "");
    const t = LIVE.at ? LIVE.at.toLocaleString("zh-TW",{hour12:false, month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
    const txt = LIVE.state==="on" ? "股價 "+t+" 更新（開盤時間約每 30 分鐘，會有延遲）" :
                LIVE.state==="wait" ? "正在讀取股價…" : "股價暫時讀不到";
    return '<div class="livebar" id="livebar"><span><span class="dot '+dot+'"></span>'+esc(txt)+'</span><button id="liveNow" type="button">重新讀取</button></div>';
  }
  function paintLive(){
    paintLiveParts();
    const lb=document.getElementById("livebar"); if(lb){ lb.outerHTML=liveBar(); bindLive(); }
  }
  function bindLive(){ const b=document.getElementById("liveNow"); if(b) b.onclick=()=>refreshPrices(); }
  async function refreshPrices(){
    if (LIVE.busy) return; LIVE.busy = true;
    try {
      const res = await fetch("prices.json?t="+Date.now(), {cache:"no-store"});
      if (!res.ok) throw new Error(res.status);
      const j = await res.json();
      const px = {};
      Object.keys(j.px||{}).forEach(k=>{ const q=j.px[k]; if(q && q.price!=null) px[k]={price:+q.price, pct:q.pct==null?null:+q.pct, mcap:q.mcap||null, mcur:q.mcur||null}; });
      LIVE.px = px; LIVE.at = j.updated ? new Date(j.updated) : null;
      LIVE.state = Object.keys(px).length ? "on" : "err";
    } catch(e){ LIVE.state = Object.keys(LIVE.px).length ? "on" : "err"; }
    LIVE.busy = false;
    paintLive();
  }
  function initLive(){
    refreshPrices();
    setInterval(()=>{ if(document.visibilityState==="visible") refreshPrices(); }, 300000);
  }
  /*LIVE-END*/

  function filtered(){
    const q = ui.q.trim().toLowerCase();
    let list = inMarket().filter(r=>{
      if (ui.status!=="all" && stOf(r)!==ui.status) return false;
      if (ui.theme!=="all" && r.theme!==ui.theme) return false;
      if (ui.stale && !isStale(r)) return false;
      if (q){ const hay=(r.ticker+" "+(r.name||"")+" "+(r.theme||"")+" "+(r.summary||"")).toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    });
    const by = {
      status:(a,b)=> STATUS_ORDER.indexOf(stOf(a))-STATUS_ORDER.indexOf(stOf(b)) || (annKey(b)-annKey(a)),
      annual:(a,b)=> annKey(b)-annKey(a),
      date:(a,b)=> String(b.date||"").localeCompare(String(a.date||"")),
      ticker:(a,b)=> String(a.ticker).localeCompare(String(b.ticker)),
      risk:(a,b)=> ((RISK_ORDER[a.risk&&a.risk.l]??9)-(RISK_ORDER[b.risk&&b.risk.l]??9)) || (annKey(b)-annKey(a))
    };
    return list.sort(by[ui.sort]||by.status);
  }

  function upcoming(){
    const t0 = today(), horizon = new Date(t0.getTime()+120*864e5);
    const out=[];
    inMarket().forEach(r=> (r.events||[]).forEach(e=>{ const d=parseD(e.date); if(d && d>=t0 && d<=horizon) out.push({d, r, e}); }));
    return out.sort((a,b)=>a.d-b.d).slice(0,14);
  }

    h += '<select id="sort" aria-label="排序">'+[["status","依結論"],["annual","依年化（高到低）"],["risk","依風險（低到高）"],["date","依研究日期（新到舊）"],["ticker","依代號"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===ui.sort?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>';

        h += '<div class="srow" data-sr="'+esc(r.ticker)+'">'+sizeRiskInner(r)+'</div>';

  }

    const sc = r.scores||{};
    [["A","成長與被取代"],["B","護城河"],["C","說到做到"],["D","估值"]].forEach(([k,t])=>{
      const s = sc[k]||{g:"na",t:"（未記錄）"};

      h += '</tbody></table></div>';
      if (r.valuationNote) h += '<p class="note">'+esc(r.valuationNote)+'</p>';
      h += '</section>';
    }

    h += '<section class="sec"><h2>什麼情況要重新評估</h2>'+list(r.invalidation)+'</section>';

    h += '<div class="grid2">';
    h += '<section class="sec"><h2>未來事件</h2>'+((r.events&&r.events.length)? '<ul>'+r.events.map(e=>'<li><span class="num small">'+esc(e.date)+'</span>　'+esc(e.text)+'</li>').join("")+'</ul>' : '<p class="muted">（未記錄）</p>')+'</section>';
    h += '<section class="sec"><h2>風險與未查項目</h2>'+list(r.risks)+(r.unknowns?'<p class="small muted">未查：'+esc(r.unknowns)+'</p>':'')+'</section>';
    h += '</div>';

    if (r.disclosure) h += '<p class="note">利益揭露（研究由 Claude 協助整理）：'+esc(r.disclosure)+'</p>';
    h += '<div class="foot">'+(r.sources?'來源：'+esc(r.sources)+'<br>':'')+'研究參考，不是投資建議。</div>';
    h += '</div>';
    $view.innerHTML = h;
    document.getElementById("back").onclick=()=>{ ui.market=mkt(r); saveUi(); location.hash = ""; };
    if (CFG.onRender) { try { CFG.onRender({view:"detail", market:mkt(r), row:r}); } catch(e){} }
    bindLive();
    if (CFG.live && mcp && !LIVE.px[r.ticker]) refreshPrices();
    window.scrollTo(0,0);
  }

  function route(){
    const m = /^#t-([A-Za-z0-9-]+)$/.exec(location.hash||"");
    if (m && loaded){
      const r = rows.find(x=>idFor(x.ticker)==="t-"+m[1]);
      if (r) return renderDetail(r);
    }
    renderList();
  }
  window.addEventListener("hashchange", route);

  function setRows(list){
    rows = list;
    const newest = rows.map(r=>r.updated||r.date||"").sort().pop();
    $stamp.textContent = rows.length? ("共 "+rows.length+" 家｜最後更新 "+(newest||"—")) : "尚無資料";
  }

  if (Array.isArray(window.RLIB_DATA)){
    loaded = true; setRows(window.RLIB_DATA); route(); initLive();
    return;
  }
  route();
  (async function(){
    let db = null;
    try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
    if (!db){ note = "這個檢視讀不到資料庫。請在 claude.ai 裡登入後開啟這個頁面。"; $stamp.textContent = "無法讀取資料"; route(); return; }
    dbRef = db;
    let timer = setTimeout(()=>{ if(!loaded){ note="資料暫時讀不到，請稍後再開。"; $stamp.textContent="資料讀取中斷"; route(); } }, 10000);
    let liveStarted = false, rerenderT = null, firstPaint = true;
    db.collection("companies").onSnapshot(snap=>{
      const old = {}; rows.forEach(r=>{ if(r.noQuote) old[r.ticker]=true; });
      const list = snap.docs.map(d=>Object.assign({ticker:d.id}, d.data(), old[d.id]?{noQuote:true}:{}));
      if (!snap.metadata.fromCache){ loaded = true; clearTimeout(timer); }
      else if (list.length) loaded = true;
      setRows(list);
      if (firstPaint){ firstPaint=false; route(); } else { clearTimeout(rerenderT); rerenderT = setTimeout(()=>{ const a=document.activeElement; if(!(a && a.id==="q")) route(); }, 1500); }
      if (loaded && !liveStarted){ liveStarted = true; initLive(); }
    }, err=>{ clearTimeout(timer); note="資料讀取失敗（"+err.code+"）。"; $stamp.textContent="資料讀取失敗"; route(); });
  })();
})();
</script>

</body>
</html>
